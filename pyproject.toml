[tool.poetry]
authors = ["황재경 <fuzzydo0ori@gmail.com>"]
description = "모구모구 백엔드 API 서비스 - FastAPI와 PostgreSQL을 사용한 현대적인 백엔드 API"
name = "mogu-mogu-backend"
version = "0.1.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"

alembic = "^1.18.3"
asyncpg = "^0.31.0"
bcrypt = "^5.0.0"
fastapi = "^0.128.0"
geoalchemy2 = "^0.18.1"
pydantic = { extras = ["dotenv", "email"], version = "^2.12.5" }
pydantic-settings = "^2.12.0"
pyjwt = "^2.11.0"
python-multipart = "^0.0.22"
shapely = "^2.0.6"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.46" }
supabase = "^2.27.2"
aiohttp = "^3.13.3"
pandas = "^3.0.0"
matplotlib = "^3.10.8"
numpy = "^2.4.2"
python-pptx = "^1.0.2"
folium = "^0.20.0"
psycopg2-binary = "^2.9.11"

[tool.poetry.group.dev.dependencies]
coverage = "^7.13.2"
freezegun = "^1.5.5"
greenlet = "^3.3.1"
httpx = "^0.28.1"
mypy = "^1.19.1"
pre-commit = "^4.5.1"
pytest = "^9.0.2"
pytest-asyncio = "^1.2.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
ruff = "^0.14.14"
uvicorn = { extras = ["standard"], version = "^0.40.0" }
types-shapely = "^2.1.0.20250917"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.pytest.ini_options]
addopts = "-vv -n auto --cov --cov-report xml --cov-report term-missing --cov-fail-under=100"
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.coverage.run]
concurrency = ["greenlet"]
omit = ["app/tests/*"]
source = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["scripts/visualize_dummy_data.py", "scripts/analyze_item_diversity.py"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pylint, pyupgrade
ignore = ["E501"]
select = ["E", "F", "I", "PL", "UP", "W"]
